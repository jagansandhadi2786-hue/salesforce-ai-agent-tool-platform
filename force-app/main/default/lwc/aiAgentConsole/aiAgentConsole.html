<template>

    <lightning-card
        title="AI Customer Service Agent"
        icon-name="utility:einstein">

        <div class="agent-container">

            <!-- Header -->
            <div class="agent-header">

                <div>
                    <div class="agent-title">
                        Customer Service Assistant
                    </div>

                    <div class="agent-subtitle">
                        Salesforce AI Agent
                    </div>
                </div>

                <lightning-button
                    label="Clear"
                    title="Clear conversation"
                    icon-name="utility:refresh"
                    onclick={clearConversation}>
                </lightning-button>

            </div>


            <!-- Chat -->
            <div
                class="chat-container"
                role="log"
                aria-live="polite">

                <template
                    for:each={messages}
                    for:item="message">

                    <!-- USER MESSAGE -->

                    <template if:true={message.isUser}>

                        <div
                            key={message.id}
                            class="message-row user-row">

                            <div class="message-bubble user-bubble">

                                <div class="message-label">
                                    You
                                </div>

                                <div class="message-text">
                                    {message.text}
                                </div>

                            </div>

                        </div>

                    </template>


                    <!-- AGENT MESSAGE -->

                    <template if:true={message.isAgent}>

                        <div
                            key={message.id}
                            class="message-row agent-row">

                            <div class="message-bubble agent-bubble">

                                <div class="message-label">
                                    AI Agent
                                </div>

                                <div class="message-text">
                                    {message.text}
                                </div>


                                <!-- Agent Metadata -->

                                <template
                                    if:true={message.hasMetadata}>

                                    <div class="metadata">

                                        <template
                                            if:true={message.intent}>

                                            <span class="metadata-item">
                                                Intent:
                                                {message.intent}
                                            </span>

                                        </template>


                                        <template
                                            if:true={message.selectedTool}>

                                            <span class="metadata-item">
                                                Tool:
                                                {message.selectedTool}
                                            </span>

                                        </template>

                                    </div>

                                </template>


                                <!-- Approval -->

                                <template
                                    if:true={message.approvalRequired}>

                                    <div class="approval-box">

                                        <lightning-icon
                                            icon-name="utility:lock"
                                            size="x-small"
                                            alternative-text="Approval required">
                                        </lightning-icon>

                                        <span>
                                            Approval required before
                                            execution.
                                        </span>

                                    </div>

                                </template>

                            </div>

                        </div>

                    </template>

                </template>


                <!-- Loading -->

                <template if:true={isLoading}>

                    <div class="message-row agent-row">

                        <div class="message-bubble agent-bubble">

                            <div class="message-label">
                                AI Agent
                            </div>

                            <div class="typing-indicator">

                                <span></span>
                                <span></span>
                                <span></span>

                            </div>

                        </div>

                    </div>

                </template>

            </div>


            <!-- Error -->

            <template if:true={errorMessage}>

                <div class="error-container">

                    <lightning-icon
                        icon-name="utility:error"
                        size="x-small"
                        alternative-text="Error">
                    </lightning-icon>

                    <span>
                        {errorMessage}
                    </span>

                </div>

            </template>


            <!-- Input -->

            <div class="input-container">

                <lightning-textarea
                    class="message-input"
                    variant="label-hidden"
                    value={userMessage}
                    onchange={handleMessageChange}
                    onkeydown={handleKeyDown}
                    placeholder="Ask the Agent...">
                </lightning-textarea>


                <lightning-button
                    variant="brand"
                    label="Send"
                    icon-name="utility:send"
                    icon-position="right"
                    onclick={handleSend}
                    disabled={sendDisabled}>
                </lightning-button>

            </div>


            <div class="input-help">

                Press Enter to send. Use Shift + Enter for a new line.

            </div>

        </div>

    </lightning-card>

</template>
