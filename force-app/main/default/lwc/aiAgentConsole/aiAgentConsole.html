<template>

    <lightning-card>

        <div class="agent-container">


            <!-- ================================================== -->
            <!-- HEADER                                             -->
            <!-- ================================================== -->

            <div class="agent-header">

                <div class="agent-title-area">

                    <div class="agent-icon">
                        🤖
                    </div>


                    <div>

                        <div class="agent-title">
                            Customer Service AI Agent
                        </div>


                        <div class="agent-subtitle">
                            Enterprise AI Assistant
                        </div>

                    </div>

                </div>


                <div class="agent-header-right">

                    <!-- AGENT STATUS -->

                    <div class="agent-status">

                        <span
                            class={agentStatusClass}
                        ></span>


                        <span>
                            {agentStatusLabel}
                        </span>

                    </div>


                    <!-- SESSION -->

                    <div class="session-info">

                        Session:
                        {formattedSessionId}

                    </div>

                </div>

            </div>


            <!-- ================================================== -->
            <!-- ERROR                                               -->
            <!-- ================================================== -->

            <template
                if:true={hasError}
            >

                <div
                    class="error-banner"
                >

                    <span>
                        {errorMessage}
                    </span>


                    <button
                        class="error-close"
                        onclick={clearError}
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </template>


            <!-- ================================================== -->
            <!-- MESSAGES                                             -->
            <!-- ================================================== -->

            <div
                class="messages-container"
            >

                <template
                    for:each={messages}
                    for:item="message"
                >

                    <div
                        key={message.id}
                        class={message.cssClass}
                    >

                        <!-- MESSAGE AVATAR -->

                        <div
                            class="message-avatar"
                        >

                            <template
                                if:true={message.isAssistant}
                            >
                                🤖
                            </template>


                            <template
                                if:true={message.isUser}
                            >
                                👤
                            </template>

                        </div>


                        <!-- MESSAGE CONTENT -->

                        <div
                            class="message-content"
                        >

                            <!-- MESSAGE ROLE -->

                            <div
                                class="message-role"
                            >

                                <template
                                    if:true={message.isAssistant}
                                >
                                    AI Agent
                                </template>


                                <template
                                    if:true={message.isUser}
                                >
                                    You
                                </template>

                            </div>


                            <!-- MESSAGE -->

                            <div
                                class="message-bubble"
                            >

                                {message.text}

                            </div>


                            <!-- TOOL METADATA -->

                            <template
                                if:true={message.selectedTool}
                            >

                                <div
                                    class="tool-info"
                                >

                                    Tool:
                                    {message.selectedTool}

                                </div>

                            </template>


                            <!-- APPROVAL -->

                            <template
                                if:true={message.approvalRequired}
                            >

                                <div
                                    class="approval-banner"
                                >

                                    Approval required
                                    before this operation
                                    can be executed.

                                </div>

                            </template>

                        </div>

                    </div>

                </template>


                <!-- ================================================== -->
                <!-- LOADING                                             -->
                <!-- ================================================== -->

                <template
                    if:true={isLoading}
                >

                    <div
                        class="message-wrapper assistant-message"
                    >

                        <div
                            class="message-avatar"
                        >
                            🤖
                        </div>


                        <div
                            class="message-content"
                        >

                            <div
                                class="message-role"
                            >
                                AI Agent
                            </div>


                            <div
                                class="message-bubble typing"
                            >

                                <span>●</span>
                                <span>●</span>
                                <span>●</span>

                                <span
                                    class="typing-text"
                                >
                                    Processing...
                                </span>

                            </div>

                        </div>

                    </div>

                </template>

            </div>


            <!-- ================================================== -->
            <!-- EXECUTION SUMMARY                                   -->
            <!-- ================================================== -->

            <template
                if:true={hasIntent}
            >

                <div
                    class="execution-summary"
                >

                    <!-- INTENT -->

                    <div
                        class="summary-item"
                    >

                        <span
                            class="summary-label"
                        >
                            Intent
                        </span>


                        <span
                            class="summary-value"
                        >
                            {currentIntent}
                        </span>

                    </div>


                    <!-- STATUS -->

                    <div
                        class="summary-item"
                    >

                        <span
                            class="summary-label"
                        >
                            Status
                        </span>


                        <span
                            class="summary-value"
                        >
                            {executionStatus}
                        </span>

                    </div>

                </div>

            </template>


            <!-- ================================================== -->
            <!-- TOOL EXECUTION TIMELINE                             -->
            <!-- ================================================== -->

            <template
                if:true={hasToolExecutions}
            >

                <div
                    class="tool-timeline"
                >

                    <div
                        class="timeline-title"
                    >
                        Tool Execution Timeline
                    </div>


                    <template
                        for:each={toolExecutions}
                        for:item="tool"
                    >

                        <div
                            key={tool.stepNumber}
                            class="tool-row"
                        >

                            <!-- STEP NUMBER -->

                            <div
                                class="tool-step"
                            >
                                {tool.stepNumber}
                            </div>


                            <!-- TOOL DETAILS -->

                            <div
                                class="tool-details"
                            >

                                <div
                                    class="tool-name"
                                >
                                    {tool.toolName}
                                </div>


                                <div
                                    class="tool-status"
                                >
                                    {tool.status}
                                </div>


                                <!-- TOOL ERROR -->

                                <template
                                    if:true={tool.errorMessage}
                                >

                                    <div
                                        class="tool-error"
                                    >
                                        {tool.errorMessage}
                                    </div>

                                </template>

                            </div>


                            <!-- EXECUTION TIME -->

                            <div
                                class="tool-duration"
                            >
                                {tool.executionTime}s
                            </div>


                            <!-- APPROVAL -->

                            <template
                                if:true={tool.approvalRequired}
                            >

                                <div
                                    class="tool-approval"
                                >
                                    Approval Required
                                </div>

                            </template>

                        </div>

                    </template>

                </div>

            </template>


            <!-- ================================================== -->
            <!-- INPUT                                                -->
            <!-- ================================================== -->

            <div
                class="input-area"
            >

                <textarea
                    class="message-input"
                    placeholder="Type your message..."
                    value={inputMessage}
                    oninput={handleInput}
                    onkeydown={handleKeyDown}
                    disabled={isLoading}
                    maxlength="4000"
                ></textarea>


                <button
                    class="send-button"
                    onclick={handleSend}
                    disabled={sendDisabled}
                >
                    Send
                </button>

            </div>


            <!-- ================================================== -->
            <!-- FOOTER                                               -->
            <!-- ================================================== -->

            <div
                class="agent-footer"
            >

                <span>
                    Enter to send • Shift+Enter for new line
                </span>


                <button
                    class="clear-button"
                    onclick={clearConversation}
                    disabled={isLoading}
                >
                    New Conversation
                </button>

            </div>


        </div>

    </lightning-card>

</template>
