<template>

    <lightning-card>

        <div
            class="agent-container"
        >

            <!-- HEADER -->

            <div
                class="agent-header"
            >

                <div
                    class="agent-title-area"
                >

                    <div
                        class="agent-icon"
                    >
                        🤖
                    </div>


                    <div>

                        <div
                            class="agent-title"
                        >
                            Customer Service AI Agent
                        </div>


                        <div
                            class="agent-subtitle"
                        >
                            Enterprise AI Assistant
                        </div>

                    </div>

                </div>


                <div
                    class="session-info"
                >

                    Session:
                    {formattedSessionId}

                </div>

            </div>


            <!-- ERROR -->

            <template
                if:true={hasError}
            >

                <div
                    class="error-banner"
                >

                    <span>
                        {errorMessage}
                    </span>


                    <button
                        class="error-close"
                        onclick={clearError}
                        title="Close"
                    >
                        ×
                    </button>

                </div>

            </template>


            <!-- MESSAGES -->

            <div
                class="messages-container"
            >

                <template
                    for:each={messages}
                    for:item="message"
                >

                    <div
                        key={message.id}
                        class={message.cssClass}
                    >

                        <div
                            class="message-avatar"
                        >

                            <template
                                if:true={message.isAssistant}
                            >
                                🤖
                            </template>


                            <template
                                if:true={message.isUser}
                            >
                                👤
                            </template>

                        </div>


                        <div
                            class="message-content"
                        >

                            <div
                                class="message-role"
                            >

                                <template
                                    if:true={message.isAssistant}
                                >
                                    AI Agent
                                </template>


                                <template
                                    if:true={message.isUser}
                                >
                                    You
                                </template>

                            </div>


                            <div
                                class="message-bubble"
                            >

                                {message.text}

                            </div>


                            <!-- TOOL METADATA -->

                            <template
                                if:true={message.selectedTool}
                            >

                                <div
                                    class="tool-info"
                                >

                                    Tool:
                                    {message.selectedTool}

                                </div>

                            </template>


                            <!-- APPROVAL -->

                            <template
                                if:true={message.approvalRequired}
                            >

                                <div
                                    class="approval-banner"
                                >

                                    Approval required
                                    before this operation
                                    can be executed.

                                </div>

                            </template>

                        </div>

                    </div>

                </template>


                <!-- LOADING -->

                <template
                    if:true={isLoading}
                >

                    <div
                        class="message-wrapper assistant-message"
                    >

                        <div
                            class="message-avatar"
                        >
                            🤖
                        </div>


                        <div
                            class="message-content"
                        >

                            <div
                                class="message-role"
                            >
                                AI Agent
                            </div>


                            <div
                                class="message-bubble typing"
                            >

                                <span>●</span>
                                <span>●</span>
                                <span>●</span>

                                <span
                                    class="typing-text"
                                >
                                    Processing...
                                </span>

                            </div>

                        </div>

                    </div>

                </template>

            </div>


            <!-- INPUT -->

            <div
                class="input-area"
            >

                <textarea
                    class="message-input"
                    placeholder="Type your message..."
                    value={inputMessage}
                    oninput={handleInput}
                    onkeydown={handleKeyDown}
                    disabled={isLoading}
                    maxlength="4000"
                ></textarea>


                <button
                    class="send-button"
                    onclick={handleSend}
                    disabled={sendDisabled}
                >
                    Send
                </button>

            </div>


            <!-- FOOTER -->

            <div
                class="agent-footer"
            >

                <span>
                    Enter to send • Shift+Enter for new line
                </span>


                <button
                    class="clear-button"
                    onclick={clearConversation}
                    disabled={isLoading}
                >
                    Clear
                </button>

            </div>

        </div>

    </lightning-card>

</template>
