# ============================================================
# Salesforce AI Agent CI
#
# Pipeline:
# 1. Checkout
# 2. Setup Node.js
# 3. Install Salesforce CLI
# 4. Verify Salesforce CLI
# 5. Verify Salesforce project
# 6. Git validation
# 7. Secret scan
# 8. Static analysis
# 9. Authenticate Salesforce
# 10. Apex tests
# 11. Upload test results
# 12. Security tests
# 13. AI tests
# 14. RAG evaluation
# 15. Deployment validation
# ============================================================

name: Salesforce AI Agent CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

  workflow_dispatch:

jobs:
  quality:
    name: Quality and Security
    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Salesforce authentication secret
    # --------------------------------------------------------

    # steps:
    # - name: Checkout repository
    # uses: actions/checkout@v5
    steps:
      # ======================================================
      # Stage 1 - Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v5

      # ======================================================
      # Stage 2 - Setup Node.js
      # ======================================================

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # npm cache intentionally disabled because the
          # repository does not currently contain a lock file.

      # ======================================================
      # Stage 3 - Install Salesforce CLI
      # ======================================================

      - name: Install Salesforce CLI
        run: |
          set -e

          npm install --global @salesforce/cli

          echo "Salesforce CLI installation completed."

      # ======================================================
      # Stage 4 - Verify Salesforce CLI
      # ======================================================

      - name: Verify Salesforce CLI
        run: |
          set -e

          sf --version
          sf plugins

      # ======================================================
      # Stage 5 - Verify Salesforce Project
      # ======================================================

      - name: Verify Salesforce project
        run: |
          set -e

          echo "Checking Salesforce DX project..."

          if [ ! -f "sfdx-project.json" ]; then
            echo "ERROR: sfdx-project.json was not found."
            echo "Current directory:"
            pwd
            echo "Repository contents:"
            ls -la
            exit 1
          fi

          echo "sfdx-project.json found."

          if [ ! -d "force-app" ]; then
            echo "ERROR: force-app directory was not found."
            exit 1
          fi

          echo "force-app directory found."
          echo "Salesforce project structure looks valid."

      # ======================================================
      # Stage 6 - Git validation
      # ======================================================

      - name: Check Git diff
        run: |
          set -e

          echo "Checking Git whitespace errors..."

          git diff --check

          echo "Git validation completed."

      # ======================================================
      # Stage 7 - Secret scan
      # ======================================================

      - name: Secret scan
        shell: bash
        run: |
          set -e

          echo "Scanning changed files for potential hard-coded secrets..."

          FOUND=0

          # --------------------------------------------------
          # Determine files changed in the current commit.
          #
          # Documentation, tests, CI workflow files and
          # examples are excluded because they intentionally
          # contain security-related keywords and patterns.
          # --------------------------------------------------

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"

            CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          else
            CHANGED_FILES=$(git diff-tree \
              --no-commit-id \
              --name-only \
              -r \
              "$GITHUB_SHA")
          fi

          echo "Files being scanned:"
          echo "$CHANGED_FILES"

          # --------------------------------------------------
          # Filter files suitable for secret scanning.
          # --------------------------------------------------

          SCAN_FILES=$(echo "$CHANGED_FILES" | grep -E \
            '\.(cls|trigger|js|ts|json|yaml|yml|xml|properties|txt)$' \
            | grep -v '^\.github/workflows/' \
            | grep -v '^docs/' \
            | grep -v 'Test\.cls$' \
            | grep -v '^scripts/' \
            | grep -v '^\.gitignore$' \
            || true)

          if [ -z "$SCAN_FILES" ]; then
            echo "No applicable source/configuration files to scan."
            exit 0
          fi

          echo ""
          echo "Scanning:"
          echo "$SCAN_FILES"

          # --------------------------------------------------
          # Detect credential-like assignments.
          # --------------------------------------------------

          if git grep -n -I -E \
            '([A-Za-z0-9_]*(API_KEY|APIKEY|CLIENT_SECRET|ACCESS_TOKEN|AUTH_TOKEN|PRIVATE_KEY|PASSWORD)[A-Za-z0-9_]*)[[:space:]]*[:=][[:space:]]*["'\''][^"'\'']{8,}["'\'']' \
            -- $SCAN_FILES; then

            echo ""
            echo "ERROR: Potential hard-coded credential detected."
            FOUND=1
          fi

          # --------------------------------------------------
          # Detect Bearer tokens.
          # --------------------------------------------------

          if git grep -n -I -E \
            'Bearer[[:space:]]+[A-Za-z0-9._~+/=-]{20,}' \
            -- $SCAN_FILES; then

            echo ""
            echo "ERROR: Potential hard-coded Bearer token detected."
            FOUND=1
          fi

          # --------------------------------------------------
          # Detect private key material.
          #
          # The workflow itself is excluded above, so the
          # scanner does not detect its own patterns.
          # --------------------------------------------------

          if git grep -n -I -E \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' \
            -- $SCAN_FILES; then

            echo ""
            echo "ERROR: Private key material detected."
            FOUND=1
          fi

          # --------------------------------------------------
          # Final result
          # --------------------------------------------------

          if [ "$FOUND" -ne 0 ]; then
            echo ""
            echo "=============================================="
            echo "SECRET SCAN FAILED"
            echo "=============================================="
            echo ""
            echo "Potential hard-coded credentials were found."
            echo "Remove secrets from source/configuration files."
            exit 1
          fi

          echo ""
          echo "=============================================="
          echo "SECRET SCAN PASSED"
          echo "=============================================="
          echo ""
          echo "No obvious hard-coded secrets detected."

      # ======================================================
      # Stage 8 - Salesforce Code Analyzer
      # ======================================================

      - name: Salesforce Code Analyzer
        run: |
          set -e

          echo "Running Salesforce Code Analyzer..."

          sf code-analyzer run \
            --target force-app \
            --output-file test-results-code-analyzer.html

          echo "Salesforce Code Analyzer completed."

      # ======================================================
      # Stage 9 - Authenticate Salesforce
      # ======================================================

      - name: Authenticate Salesforce
        shell: bash
        env:
          SFDX_AUTH_URL: ${{ secrets.SFDX_AUTH_URL }}
        run: |
          set -e

          if [ -z "$SFDX_AUTH_URL" ]; then
            echo "=============================================="
            echo "ERROR: SFDX_AUTH_URL secret is not configured."
            echo "=============================================="
            echo ""
            echo "Configure the SFDX_AUTH_URL secret in:"
            echo "GitHub Repository -> Settings -> Secrets and variables -> Actions"
            exit 1
          fi

          echo "Authenticating to Salesforce..."

          printf '%s' "$SFDX_AUTH_URL" > sfdx-auth-url.txt

          sf org login sfdx-url \
            --sfdx-url-file sfdx-auth-url.txt \
            --alias ci-org \
            --set-default

          rm -f sfdx-auth-url.txt

          echo "Salesforce authentication completed."

      # ======================================================
      # Stage 9A - Verify Salesforce Authentication
      # ======================================================

      - name: Verify Salesforce authentication
        shell: bash
        run: |
          set -e

          echo "Verifying Salesforce authentication..."

          sf org display \
            --target-org ci-org

          echo "Salesforce authentication verified."

      # ======================================================
      # Stage 10 - Apex Tests
      # ======================================================

      - name: Run Apex tests
        shell: bash
        run: |
          set -e

          echo "Running Apex test suite..."

          mkdir -p test-results

          sf apex run test \
            --target-org ci-org \
            --test-level RunLocalTests \
            --result-format junit \
            --output-dir test-results \
            --wait 30

          echo "Apex tests completed successfully."

      # ======================================================
      # Stage 11 - Upload Apex Test Results
      # ======================================================

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/
            test-results-code-analyzer.html
          if-no-files-found: warn

      # ======================================================
      # Stage 12 - Security Regression Tests
      # ======================================================

      - name: Run security regression tests
        run: |
          echo "Running security regression tests..."
          sf apex run test --target-org "$SF_TARGET_ORG" --tests AI_SecurityRegressionTest --result-format human --wait 10
          echo "Security regression tests completed."

      # ======================================================
      # Stage 13 - AI Tool Calling Tests
      # ======================================================

      - name: AI tool calling tests
        shell: bash
        run: |
          set -e

          echo "Running AI tool calling tests..."

          sf apex run test \
            --target-org ci-org \
            --tests AI_AgentAzureOpenAIServiceTest \
            --tests AI_AgentAzureToolCallingServiceTest \
            --tests AI_AgentAzureEndToEndTest \
            --result-format human \
            --wait 30

          echo "AI tool calling tests completed."

      # ======================================================
      # Stage 14 - RAG Evaluation
      # ======================================================

      - name: RAG evaluation
        shell: bash
        run: |
          set -e

          echo "RAG evaluation stage"
          echo "RAG evaluation will be enabled when the RAG test suite is available."

      # ======================================================
      # Stage 15 - Deployment Validation
      # ======================================================

      - name: Deployment validation
        shell: bash
        run: |
          set -e

          echo "Validating Salesforce deployment..."

          sf project deploy validate \
            --source-dir force-app/main/default \
            --target-org ci-org \
            --wait 30

          echo "Salesforce deployment validation completed."
