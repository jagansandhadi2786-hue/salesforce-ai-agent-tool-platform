name: Salesforce Deploy - UAT

on:
  workflow_dispatch:

  push:
    tags:
      - "v*.*.*"

jobs:
  validate-and-deploy-uat:
    name: Validate and Deploy to UAT
    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:

      # --------------------------------------------------
      # 1. Checkout source code
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --------------------------------------------------
      # 3. Install Salesforce CLI
      # --------------------------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install --global @salesforce/cli
          sf --version

      # --------------------------------------------------
      # 4. Install project dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      # --------------------------------------------------
      # 5. Authenticate to Salesforce UAT
      # --------------------------------------------------
      - name: Authenticate Salesforce UAT
        shell: bash
        env:
          SF_CLIENT_ID: ${{ secrets.SF_UAT_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_UAT_USERNAME }}
          SF_JWT_KEY: ${{ secrets.SF_UAT_JWT_KEY }}
          SF_INSTANCE_URL: ${{ secrets.SF_UAT_INSTANCE_URL }}
        run: |
          echo "$SF_JWT_KEY" > server.key

          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file server.key \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias uat-org

          rm -f server.key

      # --------------------------------------------------
      # 6. Static Code Analysis
      # --------------------------------------------------
      - name: Run Salesforce Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --output-file code-analysis.html \
            --format html
        continue-on-error: true

      # --------------------------------------------------
      # 7. Run Apex Tests
      # --------------------------------------------------
      - name: Run Apex Tests
        run: |
          sf apex run test \
            --target-org uat-org \
            --test-level RunLocalTests \
            --wait 30 \
            --result-format human

      # --------------------------------------------------
      # 8. Validate deployment
      # --------------------------------------------------
      - name: Validate Salesforce deployment
        run: |
          sf project deploy validate \
            --source-dir force-app \
            --target-org uat-org \
            --test-level RunLocalTests \
            --wait 30

      # --------------------------------------------------
      # 9. Deploy to UAT
      # --------------------------------------------------
      - name: Deploy to Salesforce UAT
        run: |
          sf project deploy start \
            --source-dir force-app \
            --target-org uat-org \
            --test-level RunLocalTests \
            --wait 30

      # --------------------------------------------------
      # 10. Deployment Summary
      # --------------------------------------------------
      - name: Deployment Summary
        if: always()
        run: |
          echo "======================================"
          echo "Salesforce UAT Deployment Completed"
          echo "======================================"
          echo "Commit: $GITHUB_SHA"
          echo "Reference: $GITHUB_REF"
          echo "Run ID: $GITHUB_RUN_ID"